name: "[crdh] Build, Release, Deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "preview"

jobs:
  build-release:
    uses: chnm/.github/.github/workflows/hugo--build-release.yml@main
    secrets: inherit
    with:
      container-registry: "ghcr.io"
      container-image-name: "crdh-website"
      hugo-context-root: "."
      hugo-devl-url: "https://dev.crdh.rrchnm.org"
      hugo-prod-url: "https://crdh.rrchnm.org"

      build-artifact-name: "crdh-website"
      release-tag-name-type: "iso"

      website-devl-fqdn: "dev.crdh.rrchnm.org"
      website-prod-fqdn: "crdh.rrchnm.org"

  deploy:
    uses: chnm/.github/.github/workflows/docker--deploy.yml@main
    needs: [build-release]
    secrets: inherit
    with:
      website-devl-fqdn: "dev.crdh.rrchnm.org"
      website-prod-fqdn: "crdh.rrchnm.org"
